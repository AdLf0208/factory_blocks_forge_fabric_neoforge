[package]
# Content port of: Factory Blocks 1.4.2 (matthewperiut/factory_blocks,
# CC0-1.0 on Modrinth; the loader metadata says MIT). The census/state model
# is a clean-room Rust rewrite; the textures, models and lang are the upstream
# mod's own assets and are LOCAL-ONLY until the maintainer approves publishing
# (ARCHITECTURE.md §8).
name = "horizon-factory-blocks"
version = "1.4.2"
edition = "2024"
rust-version = "1.95"
license = "CC0-1.0"
description = "Factory Blocks' 49 decorative industrial blocks for Horizon"
publish = false

[lib]
# This exact source is also injected as a same-crate module by horizon-mixins.
path = "mixins/factory_blocks/runtime.rs"
